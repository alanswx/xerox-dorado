name: Deploy WASM emulator to GitHub Pages

# Builds the Emscripten/WebAssembly Dorado emulator (Alto-on-Dorado world)
# and publishes web/ to GitHub Pages. Runs on pushes to main that touch the
# emulator or the web frontend, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'dorado/**'
      - 'chm/bootfiles/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer run cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        # Pinned, not "latest": emsdk 6.0.2 generates resizable-ArrayBuffer
        # heap views (toResizableBuffer) whose TextDecoder.decode() throws
        # "ArrayBuffer must not be resizable" in current stable Chrome --
        # the page dies at callMain before booting. 6.0.0 uses the legacy
        # grow path and is what the build was verified against locally.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0

      - name: Verify emcc
        run: emcc --version

      - name: Build WebAssembly frontend
        working-directory: dorado
        run: make web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dorado/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
