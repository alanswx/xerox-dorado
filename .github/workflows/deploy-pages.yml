name: Deploy WASM emulator to GitHub Pages

# Builds the Emscripten/WebAssembly Dorado emulator (Alto-on-Dorado world)
# and publishes web/ to GitHub Pages. Runs on pushes to main that touch the
# emulator or the web frontend, and on demand.
on:
  push:
    branches: [main]
    paths:
      - 'dorado/**'
      - 'chm/bootfiles/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer run cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        # Pinned, not "latest": emsdk 6.0.2 generates resizable-ArrayBuffer
        # heap views (toResizableBuffer) whose TextDecoder.decode() throws
        # "ArrayBuffer must not be resizable" in current stable Chrome --
        # the page dies at callMain before booting. 6.0.0 uses the legacy
        # grow path and is what the build was verified against locally.
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0

      - name: Verify emcc
        run: emcc --version

      # Profile-guided optimization is worth 27% in the browser (0.54x ->
      # 0.68x of a real Dorado, byte-identical). Emscripten cannot COLLECT a
      # profile -- an instrumented wasm build writes no .profraw -- but it
      # can USE one, because profiles are keyed by function name. So collect
      # it from a NATIVE build here and let `make web` consume it.
      #
      # Best effort on purpose. If the native build or the training run
      # fails, we carry on and ship an unprofiled build rather than losing
      # the deploy.
      # CC=clang is required, not cosmetic: the runner's default cc is gcc,
      # whose -fprofile-generate produces a format emsdk's clang cannot read
      # (the first attempt at this failed on the flag spelling alone).
      - name: Collect PGO profile from a native build (best effort)
        working-directory: dorado
        run: make pgo CC=clang || echo "pgo unavailable; continuing without a profile"

      # The risk this guards is specific: the profile is written by the
      # RUNNER's clang and consumed by emsdk's clang, and a profile-format
      # version mismatch is a compile ERROR, not a silent skip -- it would
      # take the deploy down. Prove the two agree on a one-line program
      # first, and drop the profile if they do not.
      - name: Verify emsdk clang accepts the profile
        working-directory: dorado
        run: |
          if [ -f build/pgo/dorado.profdata ]; then
            echo 'int main(void){return 0;}' > /tmp/pgo-probe.c
            if emcc -O3 -flto -fprofile-instr-use=build/pgo/dorado.profdata \
                 /tmp/pgo-probe.c -o /tmp/pgo-probe.js 2>/tmp/pgo-probe.log; then
              echo "profile accepted; the browser build will be PGO-optimised"
            else
              echo "profile REJECTED by emsdk clang -- building without it:"
              cat /tmp/pgo-probe.log
              rm -f build/pgo/dorado.profdata
            fi
          else
            echo "no profile collected; building without one"
          fi

      - name: Build WebAssembly frontend
        working-directory: dorado
        run: make web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dorado/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
