<!DOCTYPE HTML PUBLIC "- //W3C//DTD HTML 4.0 //EN">
<html>
<head>
    <style type="text/css">
        /* Tioga Looks, roughly translated into CSS, applied to SPANs: */
        /* "annotation font" */
        span.look-a {
            font-family: 'Times New Roman', Times, serif;
            font-size: medium
        }
        /* "bold font" */
        span.look-b {
            font-weight: bold
        }
        /* "cedar comments" */
        span.look-c {
            font-style: italic
        }
        /* "down for subscript" */
        span.look-d {
            font-size: x-small;
            vertical-align: sub
        }
        /* "emphasis" */
        span.look-e {
            /* TODO: In original look, this is handled differently if in a comment! */
            font-weight: bold
        }
        /* "fixed pitch font" */
        span.look-f {
            font-family: 'Courier New, Courier, monospace';
        }
        /* "greek" */
        span.look-g {
            font-family: 'Helvetica Greek';
        }
        /* "hidden by asterisks or something" */
        span.look-h {
            text-decoration: line-through
        }
        /* "italic" */
        span.look-i {
            font-style: italic
        }
        /* "kanji" */
        span.look-j {
            /* TODO: This will require special translation */
        }
        /* "CEDAR KEYWORDS" */
        span.look-k {
            font-size : small;
            font-family: 'Times New Roman', Times, serif
        }
        /* "larger font" */
        span.look-l {
            font-size: larger
        }
        /* "Math Math font*/
        span.look-m {
            /* TODO: This will require special translation. */
        }
        /* "Cedar procedure names" */
        span.look-n {
            font-weight: bold
        }
        /* "other font" */
        span.look-o {
            font-family: 'Helvetica'
        }
        span.look-p {
            font-size:medium;
            font-family:'Times New Roman'
        }
        /* "Quaint XEROX logo font*/
        span.look-q {
            /* TODO: This will require special translation */
            font-size: x-large
        }
        /* "regular face -- override node format */
        span.look-r {
            font-style: normal;
            font-weight: normal;
            font-size: medium;
        }
        /* "smaller size" */
        span.look-s {
            font-size: small
        }
        /* "tiogoa font" (code font) */
        span.look-t {
            font-family: Courier New, Courier, monospace
        }
        /* "up, for superscript" */
        span.look-u {
            font-size: x-small;
            vertical-align: super
        }
        /* "video reverse" */
        span.look-v {
            background-color: black;
            color: white;
        }
        /* "'what about this' annotation looks" */
        span.look-w {
            font-family: Helvetica;
            font-weight: bold
        }
        /* "extra large" */
        span.look-x {
            font-size: x-large
        }
        /* "arbitrary for strikeout" */
        span.look-y {
            text-decoration: line-through
        }
        /* "arbitrary for underlined" */
        span.look-z {
            text-decoration: underline
        }

        /* Tioga Styles, roughly translated into CSS, applied to DIVs: */

        div.abstract, div.authors, div.block, div.block1, div.body, div.body1, div.cedarRoot, div.code,
        div.code1, div.code2, div.code3, div.indent, div.indent1, div.item, div.note, div.parametertable,
        div.quote, div.ragged, div.raggedLeft, div.reference, div.standard, div.table, div.table0, div.table1,
        div.table2, div.table3, div.table4, div.tight, div.unit, div.unleaded, div.widowSaver {
            font-size: initial;
            font-weight: normal;
            font-style: normal;
            text-wrap: normal;
            text-align: justify;
            text-indent: initial;
            padding: 2pt 0pt 8pt 0pt;
            margin-left: 18pt
        }

        /* "for abstract on title page" */
        div.abstract {
            font-family: Helvetica;
            tab-size: 14;
            margin-left: initial
        }
        div.artworkFigure {
            align-content: center
        }
        div.artworkCaption {
            font-family: Helvetica;
            font-weight: bold
        }
        div.ascii {
            font-family: Courier New, Courier, monospace;
            font-size: initial;
            /* TODO: this probably doesn't work */
            max-width: 82em
        }
        div.authors {
            font-family: Helvetica;
            font-size: larger;
            text-wrap: none
        }

        div.block1 {
            /* TODO: translate "more top leading" to something */
        }
        div.body {
            text-indent: 1em
        }
        div.body1 {
            text-indent: 1em
            /* TODO: translate "extra top leading" to something */
        }
        div.boilerplate {
            font-family: 'Times New Roman';
            text-wrap: normal;
            text-align: justify;
            hyphens: none
        }
        div.cedarRoot, div.root {
            margin-top: 0.5in;
            margin-left: 1.5in;
            margin-right: 1.5in;
            margin-bottom: 0.5in;
        }
        div.center {
            align-content: center
        }
        div.chapter {
            font-weight: bold;
            font-size: x-large;
        }
        div.code, div.code1, div.code2, div.code3, div.unit {
            font-family: Courier New, Courier, monospace;
            font-size: initial;
            padding: initial
        }
        div.continuation {
            font-family: 'Times New Roman';
            text-wrap: normal;
            text-align: justify
        }
        div.copyrightNotice {
            font-family: Arial, Helvetica, sans-serif;
            font-size: larger
        }
        div.default {
            font-size: initial;
            font-weight: normal;
            font-stretch: normal;
            font-family: Courier New, Courier, monospace;
            tab-size: 4
        }
        div.display {
            font-family: 'Times New Roman';
            text-wrap: normal;
            text-align: justify;
            hyphens: none
        }
        div.head, div.head1, div.title {
            font-size: x-large;
            font-weight: bold;
        }
        div.head > div.head {
            font-size: large;
            font-weight: bold;
            margin-left: 18pt
        }
        div.head > div.head > div.head {
            font-size: medium;
            font-style: italic;
            font-weight: normal;
            margin-left: 18pt
        }
        div.head2 {
            font-weight: bold;
        }
        div.head3 {
            font-style: italic
        }
        div.head4, div.head5 {
            font-family: 'Times New Roman';
            text-wrap: normal;
            text-align: justify
        }
        div.indent, div.indent1 {
            margin-left: 36pt
        }
        div.item, div.item1 {
            margin-left: 36pt
        }
        div.logo {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: x-large;
        }
        div.parametertable {
            hyphens: none;
            tab-size: 15;
        }
        div.note {
            font-size: x-small;
        }
        div.quote {
            text-indent: each-line
        }
        div.ragged {
            text-align: left
        }
        div.raggedLeft {
            text-align: right
        }
        div.reference {
            hyphens: none
        }
        div.table, div.table0, div.table1, div.table2, div.table3, div.table4 {
            hyphens: none;
            tab-size: 40;
            text-align: left;
        }
        div.table0 {
            tab-size: 35;
        }
        div.table1 {
            tab-size: 30;
        }
        div.table2 {
            tab-size: 25;
        }
        div.table3 {
            tab-size: 20;
        }
        div.table4 {
            tab-size: 15;
        }
        div.tight {
            padding: 2pt 0pt 4pt 0pt;
        }
        div.title {
            font-family: 'Helvetica';
            font-size: xx-large;
            text-align: left;
            text-indent: initial;
        }
        div.unleaded {
            text-indent: initial;
            text-align: left;
        }
        div.widowSaver {

        }
